<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Movie Picks</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5EbdO7/g=" crossorigin="anonymous"></script>
  <script src="js/script.js"></script>
</head>
<body>
  <div id="wrapper">
    <aside>
      <h1>Halloween<br>Movie<br>Picks</h1>
      <nav>
        <ul>
          <li class="current"><a href="#coraline">Coraline</a></li>
          <li><a href="#it">IT</a></li>
          <li><a href="#addams">The Addams Family</a></li>
          <li><a href="#monster-house">Monster House</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <section id="coraline">
        <div class="card">
          <img src="images/coraline.jpg" alt="Coraline poster">
          <div class="text">
            <p class="eyebrow">01</p>
            <h2>Coraline</h2>
            <h3>コララインとボタンの魔女</h3>
            <p class="desc">不思議な世界に迷いこむ、ダークでかわいい物語。</p>
          </div>
        </div>
      </section>

      <section id="it">
        <div class="card">
          <img src="images/it.jpg" alt="IT poster">
          <div class="text">
            <p class="eyebrow">02</p>
            <h2>IT</h2>
            <h3>IT／イット</h3>
            <p class="desc">赤い風船が不気味な、スリルたっぷりのホラー。</p>
          </div>
        </div>
      </section>

      <section id="addams">
        <div class="card">
          <img src="images/addams.jpg" alt="The Addams Family poster">
          <div class="text">
            <p class="eyebrow">03</p>
            <h2>The Addams Family</h2>
            <h3>アダムス・ファミリー</h3>
            <p class="desc">ちょっと奇妙でユーモラスな、ゴシック家族の物語。</p>
          </div>
        </div>
      </section>

      <section id="monster-house">
        <div class="card">
          <img src="images/monster-house.jpg" alt="Monster House poster">
          <div class="text">
            <p class="eyebrow">04</p>
            <h2>Monster House</h2>
            <h3>モンスター・ハウス</h3>
            <p class="desc">家そのものが怪物になる、ワクワク系アニメホラー。</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
